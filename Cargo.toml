[package]
name = "bmctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Control and monitor a server's BMC over Redfish, from the terminal"
repository = "https://github.com/PabloSoage/bmctl"
license = "MIT"
readme = "README.md"
keywords = ["redfish", "bmc", "ipmi", "server", "monitoring"]
categories = ["command-line-utilities"]

[[bin]]
name = "bmctl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
directories = "5"
toml = "0.8"
rpassword = "7"
crossterm = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
